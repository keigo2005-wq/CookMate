[server]
# sentence-transformers(埋め込みモデル)が持つ大量の未使用サブモジュールを
# 自動リロード監視が毎回スキャンしようとして重くなるため、監視を止める。
# コード変更後は手動でサーバーを再起動する。
fileWatcherType = "none"

[theme]
base = "light"
primaryColor = "#B3401D"
backgroundColor = "#FFF8F5"
secondaryBackgroundColor = "#F4E0D6"
textColor = "#271A13"
font = "sans serif"
